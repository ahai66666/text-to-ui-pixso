name: skill-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm resources:check && pnpm catalog:check && pnpm index:check && pnpm skill:check
      - run: pnpm test
      - run: pnpm skill:pack --out dist/${{ github.event.repository.name }}-candidate.zip
